<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大促分会场 · 头图生成器</title>
    <style>
        @font-face {
            font-family: "POIZONSans";
            src: url("POIZONSans-Medium250109.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f5f5f5; margin: 0; padding: 0; overflow: hidden; }

        .main-container { display: flex; width: 100vw; height: 100vh; }

        /* ── 左侧面板 ── */
        .left-panel {
            width: 460px;
            background: white;
            overflow-y: auto;
            border-right: 1px solid #e0e0e0;
            padding: 28px 24px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.04);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .left-panel::-webkit-scrollbar { width: 4px; }
        .left-panel::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

        .panel-title { font-size: 17px; font-weight: 700; color: #1a1a1a; margin: 0; }

        .section-label {
            font-size: 15px; font-weight: 700; color: #1a1a1a;
            letter-spacing: 0.2px; margin-bottom: 12px;
        }

        /* ── 品类选择 — 单选按钮组 ── */
        .category-radio-group { display: flex; gap: 24px; align-items: center; }
        .category-radio-item { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
        .category-radio-item input[type="radio"] { display: none; }
        .radio-circle {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid #ccc; background: white;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s;
            flex-shrink: 0;
        }
        .radio-circle::after {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: #06805c; opacity: 0; transition: opacity 0.15s;
        }
        .category-radio-item input[type="radio"]:checked + .radio-circle { border-color: #06805c; }
        .category-radio-item input[type="radio"]:checked + .radio-circle::after { opacity: 1; }
        .radio-label { font-size: 13px; color: #48484D; font-weight: 600; }

        /* ── 商品图 ── */
        .product-pair { margin-bottom: 8px; }
        .pair-upload { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }

        /* 可点击上传画框 */
        .upload-item {
            background: white; border-radius: 8px; border: 1.5px dashed #d0d0d0;
            cursor: pointer; position: relative; transition: border-color 0.15s;
            display: flex; flex-direction: column;
            min-height: 160px;
        }
        .upload-item:hover { border-color: #06805c; }
        .upload-item.has-image { border-style: solid; border-color: #c8e8df; }
        .upload-item input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }

        /* 空态占位 — 撑满整个画框 */
        .upload-placeholder {
            flex: 1;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 6px; pointer-events: none;
            min-height: 160px;
        }
        .upload-placeholder .plus { font-size: 24px; color: #c0c0c0; line-height: 1; }
        .upload-item-label {
            font-size: 12px; font-weight: 600; color: #aaa;
            text-align: center; pointer-events: none;
        }
        /* 有图后隐藏占位 */
        .upload-item.has-image .upload-placeholder { display: none; }

        .prod-preview-canvas-wrap { display: none; flex-direction: column; }
        .upload-item.has-image .prod-preview-canvas-wrap { display: flex; }
        .prod-preview-canvas-wrap canvas {
            display: block; width: 100% !important; height: auto !important;
            border-radius: 7px; background: #f4f4f4; cursor: zoom-in;
        }
        .preview-hint { font-size: 10px; color: #bbb; margin: 4px 8px 6px; line-height: 1.5; }

        /* 精细调整 — 放在画框外部 */
        .adv-toggle {
            font-size: 11px; color: #06805c; cursor: pointer;
            margin-top: 6px; display: inline-flex; align-items: center; gap: 4px;
            user-select: none;
        }
        .adv-toggle::before { content: '▶'; font-size: 9px; transition: transform 0.2s; }
        .adv-toggle.open::before { transform: rotate(90deg); }
        .advanced-options {
            margin-top: 4px; padding: 10px; background: #f0f9f6;
            border-radius: 8px; display: none; border: 1px solid #c8e8df;
        }
        .advanced-options.show { display: block; }
        .control-group { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .control-group:last-child { margin-bottom: 0; }
        .control-group label { font-size: 11px; font-weight: 600; min-width: 64px; color: #555; }
        .control-group input[type="range"] { flex: 1; min-width: 60px; }
        .control-group input[type="number"] { width: 50px; padding: 3px 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 11px; }

        /* 文案 */
        .text-section { display: flex; flex-direction: column; gap: 16px; }
        .text-block label { display: block; font-size: 13px; font-weight: 700; color: #48484D; margin-bottom: 6px; }
        .text-input {
            width: 100%; padding: 11px 12px; border: 1px solid #ddd;
            border-radius: 7px; font-size: 13px; background: white;
            color: #48484D; transition: border-color 0.15s;
        }
        .text-input::placeholder { color: #c8c8c8; }
        .text-input:focus { outline: none; border-color: #06805c; box-shadow: 0 0 0 3px rgba(6,128,92,0.08); }

        /* ── 左侧面板模块分隔 ── */
        .panel-section {
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        /* 品类→文案 间距小一点 */
        .panel-section.section-cat { padding-bottom: 14px; }
        /* 文案→商品图 去掉分隔线，间距小一点 */
        .panel-section.section-text { border-bottom: none; padding-bottom: 14px; }
        .panel-section:last-of-type { border-bottom: none; padding-bottom: 0; }

        .upload-hint {
            font-size: 11px; color: #aaa; line-height: 1.7;
            background: #f5f5f5; border-radius: 7px;
            padding: 10px 12px; margin-top: 14px;
        }

        /* ── 按钮区 ── */
        .btn-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
        }
        .gen-btn {
            padding: 13px; background: #06805c; color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .gen-btn:hover { background: #056b4a; }
        .gen-btn:active { background: #044f37; }
        .dl-btn {
            padding: 13px; background: #313133; color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .dl-btn:hover { background: #444446; }
        .dl-btn:active { background: #1e1e1f; }
        .dl-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* ── 右侧画布 ── */
        .right-panel {
            flex: 1; background: #ebebeb;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        /* 工具栏 */
        .canvas-toolbar {
            position: absolute; top: 16px; right: 16px;
            display: flex; gap: 6px; z-index: 20;
            background: white; padding: 6px 8px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .toolbar-btn {
            width: 30px; height: 30px; border: 1px solid #e0e0e0;
            background: white; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; transition: all 0.15s; color: #444;
        }
        .toolbar-btn:hover { background: #f5f5f5; border-color: #06805c; color: #06805c; }
        .toolbar-btn.active { background: #06805c; color: white; border-color: #06805c; }

        /* 画布容器（可缩放拖拽） */
        .canvas-wrapper {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; cursor: grab;
        }
        .canvas-wrapper.locked { cursor: default; }
        .canvas-inner {
            transform-origin: center center;
            transition: none;
            position: relative;
        }
        .canvas-inner canvas {
            display: block;
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }

        /* 状态提示 */
        .status-bar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,30,0.82); color: white;
            padding: 8px 18px; border-radius: 20px; font-size: 13px;
            white-space: nowrap; pointer-events: none;
            opacity: 0; transition: opacity 0.3s;
        }
        .status-bar.show { opacity: 1; }

        /* lightbox */
        .lightbox-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.78); z-index: 9999;
            align-items: center; justify-content: center; cursor: zoom-out;
        }
        .lightbox-overlay.show { display: flex; }
        .lightbox-overlay img {
            max-width: 92vw; max-height: 92vh;
            border-radius: 10px; object-fit: contain;
            box-shadow: 0 12px 48px rgba(0,0,0,0.5);
        }

        /* 空态提示 */
        .canvas-placeholder {
            color: #c0c0c0; font-size: 14px; text-align: center; pointer-events: none;
        }
        .canvas-placeholder svg { display: block; margin: 0 auto 12px; opacity: 0.35; }
    </style>
</head>
<body>
<div class="main-container">

    <!-- ══ 左侧面板 ══ -->
    <div class="left-panel">
        <h1 class="panel-title">配置分会场头图</h1>

<script type="module">
import { removeBackground } from 'https://esm.run/@imgly/background-removal';

// ═══════════════════════════════════════════════════
//  常量 & 状态
// ═══════════════════════════════════════════════════
const CANVAS_W = 1125, CANVAS_H = 519;
const DECO4_POS      = { x: 720,  y: 449, width: 340 };
const DECO_LEFT_POS  = { x: 531,  y: 307, width: 210 };
const DECO_RIGHT_POS = { x: 895,  y: 307, width: 210 };
const PREVIEW_W = 268, PREVIEW_H = 300;
const PROD_A_POS = { x: 607, y: 198 };
const PROD_B_POS = { x: 780, y: 198 };
const TITLE_POS    = { x: 42, y: 268 };
const SUBTITLE_POS = { x: 42, y: 370 };

const TEXT_STYLE = { mainColor: '#000000', mainSize: 69, subColor: '#000000', subSize: 36, highlightColor: '#FF0000' };

// 后台固定素材
let bgImg = null, decoLeft = null, decoRight = null, deco4Img = null;

// 商品
const products = {
    A: { noBg: null, snapshot: null },
    B: { noBg: null, snapshot: null },
};

// 当前选中品类
let currentCat = 'other';

// ═══════════════════════════════════════════════════
//  工具函数
// ═══════════════════════════════════════════════════
function loadImg(src) {
    return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = src;
    });
}

function getTrimBounds(canvas) {
    const ctx = canvas.getContext('2d');
    const { width: w, height: h } = canvas;
    const d = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = 0, maxY = 0;
    for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++)
            if (d[(y * w + x) * 4 + 3] > 10) {
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
    if (maxX < minX) return null;
    return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

function calcAutoScale(noBgCanvas) {
    const b = getTrimBounds(noBgCanvas);
    if (!b) return 1;
    const sw = PREVIEW_W / b.w;
    return b.h * sw <= PREVIEW_H ? sw : PREVIEW_H / b.h;
}

// 将 canvas 内容旋转指定角度（度），返回新 canvas
function rotateCanvas(src, degrees) {
    const rad = degrees * Math.PI / 180;
    const b = getTrimBounds(src);
    if (!b) return src;

    // 裁剪出有效内容区
    const tmpC = document.createElement('canvas');
    tmpC.width = b.w; tmpC.height = b.h;
    tmpC.getContext('2d').drawImage(src, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);

    const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
    const newW = Math.ceil(b.w * cos + b.h * sin);
    const newH = Math.ceil(b.w * sin + b.h * cos);

    const out = document.createElement('canvas');
    out.width = newW; out.height = newH;
    const ctx = out.getContext('2d');
    ctx.translate(newW / 2, newH / 2);
    ctx.rotate(rad);
    ctx.drawImage(tmpC, -b.w / 2, -b.h / 2);
    return out;
}

function drawToPreview(canvas, noBg, scale, offsetY, offsetX) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, PREVIEW_W, PREVIEW_H);
    const b = getTrimBounds(noBg);
    if (!b) return;
    const dw = Math.round(b.w * scale), dh = Math.round(b.h * scale);
    ctx.drawImage(noBg, b.x, b.y, b.w, b.h, (PREVIEW_W - dw) / 2 + offsetX, PREVIEW_H - dh + offsetY, dw, dh);
}

function snapshotCanvas(canvas) {
    return { dataURL: canvas.toDataURL('image/png'), w: PREVIEW_W, h: PREVIEW_H };
}

function bindSlider(slider, num, onChange) {
    slider.addEventListener('input', () => { num.value = slider.value; onChange(); });
    num.addEventListener('input', () => { slider.value = num.value; onChange(); });
}

// ═══════════════════════════════════════════════════
//  状态提示
// ═══════════════════════════════════════════════════
let statusTimer = null;
function showStatus(msg, duration = 3000) {
    const el = document.getElementById('statusBar');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(statusTimer);
    if (duration > 0) statusTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ═══════════════════════════════════════════════════
//  加载后台固定素材
// ═══════════════════════════════════════════════════
async function loadAssets() {
    [bgImg, decoLeft, decoRight, deco4Img] = await Promise.all([
        loadImg('background.png'),
        loadImg('deco_left_A.png'),
        loadImg('deco_right_A.png'),
        loadImg('deco4.png'),
    ]);
    await document.fonts.load(`400 69px "POIZONSans"`);
}

// ═══════════════════════════════════════════════════
//  品类选择
// ═══════════════════════════════════════════════════
function initCategories() {
    document.querySelectorAll('input[name="category"]').forEach(radio => {
        radio.addEventListener('change', () => {
            currentCat = radio.value;
            schedulePreview();
        });
    });
}

// ═══════════════════════════════════════════════════
//  AI 抠图
// ═══════════════════════════════════════════════════
async function processFile(file) {
    const isPng = file.type === 'image/png' || file.name.toLowerCase().endsWith('.png');
    const hasAlpha = isPng && await checkTransparency(file);
    if (hasAlpha) return loadPngDirect(file);

    const blob = await removeBackground(file, { output: { format: 'image/png', quality: 1 } });
    return blobToCanvas(blob);
}

function checkTransparency(file) {
    return new Promise(res => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img, 0, 0);
            const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
            for (let i = 3; i < d.length; i += 32) if (d[i] < 250) { res(true); return; }
            res(false);
        };
        img.onerror = () => res(false);
        img.src = url;
    });
}

function loadPngDirect(file) {
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            // 去豆包水印
            ctx.clearRect(Math.floor(c.width * 0.80), Math.floor(c.height * 0.92), c.width, c.height);
            res(c);
        };
        img.onerror = rej;
        img.src = url;
    });
}

function blobToCanvas(blob) {
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img, 0, 0);
            res(c);
        };
        img.onerror = rej;
        img.src = url;
    });
}

// ═══════════════════════════════════════════════════
//  商品上传绑定
// ═══════════════════════════════════════════════════
function bindProductUpload(side) {
    const fileEl      = document.getElementById(`file${side}`);
    const uploadItem  = document.getElementById(`uploadItem${side}`);
    const canvas      = document.getElementById(`previewCanvas${side}`);
    const advToggle   = document.getElementById(`advToggle${side}`);
    const advPanel    = document.getElementById(`advPanel${side}`);
    const scaleSlider = document.getElementById(`scaleSlider${side}`);
    const scaleNum    = document.getElementById(`scaleNum${side}`);
    const offSlider   = document.getElementById(`offsetSlider${side}`);
    const offNum      = document.getElementById(`offsetNum${side}`);
    const offxSlider  = document.getElementById(`offsetxSlider${side}`);
    const offxNum     = document.getElementById(`offsetxNum${side}`);

    // 精细调整折叠（阻止冒泡，防止触发 file input）
    advToggle.addEventListener('click', e => {
        e.stopPropagation();
        const open = advPanel.classList.toggle('show');
        advToggle.classList.toggle('open', open);
    });
    advPanel.addEventListener('click', e => e.stopPropagation());

    // 滑块联动
    const refresh = () => {
        const noBg = products[side].noBg;
        if (!noBg) return;
        drawToPreview(canvas, noBg, parseFloat(scaleNum.value) / 100, parseInt(offNum.value) || 0, parseInt(offxNum.value) || 0);
        products[side].snapshot = snapshotCanvas(canvas);
        schedulePreview();
    };
    bindSlider(scaleSlider, scaleNum, refresh);
    bindSlider(offSlider, offNum, refresh);
    bindSlider(offxSlider, offxNum, refresh);

    // 文件上传
    fileEl.addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, PREVIEW_W, PREVIEW_H);
        ctx.fillStyle = '#aaa';
        ctx.font = '14px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('处理中，加载模型约10秒', PREVIEW_W / 2, PREVIEW_H / 2);
        ctx.textAlign = 'left';

        try {
            let noBg = await processFile(file);
            // 鞋类：旋转 35 度后再计算缩放
            if (currentCat === 'shoes') {
                noBg = rotateCanvas(noBg, 35);
            }
            products[side].noBg = noBg;
            const autoScale = Math.round(calcAutoScale(noBg) * 100);
            scaleSlider.value = scaleNum.value = autoScale;
            offSlider.value = offNum.value = 0;
            offxSlider.value = offxNum.value = 0;
            drawToPreview(canvas, noBg, autoScale / 100, 0, 0);
            products[side].snapshot = snapshotCanvas(canvas);
            uploadItem.classList.add('has-image');
            schedulePreview();
        } catch (err) {
            ctx.clearRect(0, 0, PREVIEW_W, PREVIEW_H);
            ctx.fillStyle = '#f87171';
            ctx.fillText('处理失败，请重试', PREVIEW_W / 2, PREVIEW_H / 2);
            ctx.textAlign = 'left';
            console.error(err);
        }
    });

    // 点击预览大图（阻止冒泡，不触发 file input）
    canvas.addEventListener('click', e => {
        if (!products[side].noBg) return;
        e.stopPropagation();
        document.getElementById('lightboxImg').src = canvas.toDataURL('image/png');
        document.getElementById('lightboxOverlay').classList.add('show');
    });
}

// ═══════════════════════════════════════════════════
//  文字渲染
// ═══════════════════════════════════════════════════
function drawSubtitle(ctx, text, x, y, fontSize, color, highlightWords, hlColor) {
    if (!text) return;
    ctx.textBaseline = 'top';
    if (!highlightWords || !highlightWords.trim()) {
        ctx.font = `400 ${fontSize}px "PingFang SC"`;
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        return;
    }
    const words = highlightWords.split(/[\s,，]+/).map(w => w.trim()).filter(Boolean);
    const regex = new RegExp(`(${words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
    const parts = []; let last = 0, m;
    while ((m = regex.exec(text)) !== null) {
        if (m.index > last) parts.push({ t: text.slice(last, m.index), hi: false });
        parts.push({ t: m[0], hi: true });
        last = regex.lastIndex;
    }
    if (last < text.length) parts.push({ t: text.slice(last), hi: false });
    let curX = x;
    parts.forEach(p => {
        ctx.font = `${p.hi ? 600 : 400} ${fontSize}px "PingFang SC"`;
        ctx.fillStyle = p.hi ? hlColor : color;
        ctx.fillText(p.t, curX, y);
        curX += ctx.measureText(p.t).width;
    });
}

// ═══════════════════════════════════════════════════
//  实时预览渲染（防抖 50ms）
// ═══════════════════════════════════════════════════
let _previewTimer = null;
function schedulePreview() {
    clearTimeout(_previewTimer);
    _previewTimer = setTimeout(renderPreview, 50);
}

async function renderPreview() {
    if (!bgImg) return;

    const canvas = document.createElement('canvas');
    canvas.width = CANVAS_W; canvas.height = CANVAS_H;
    const ctx = canvas.getContext('2d');

    const drawScaled = (img, x, y, tw) => {
        if (!img) return;
        ctx.drawImage(img, x, y, tw, img.height * (tw / img.width));
    };

    // 1. 底图
    ctx.drawImage(bgImg, 0, 0, CANVAS_W, CANVAS_H);

    // 2. 左右装饰
    drawScaled(decoLeft,  DECO_LEFT_POS.x,  DECO_LEFT_POS.y,  DECO_LEFT_POS.width);
    drawScaled(decoRight, DECO_RIGHT_POS.x, DECO_RIGHT_POS.y, DECO_RIGHT_POS.width);

    // 3. 商品图（有哪张画哪张，不强制要求两张都有）
    const drawSnap = (snap, x, y) => new Promise(res => {
        if (!snap) { res(); return; }
        const img = new Image();
        img.onload = () => { ctx.drawImage(img, x, y, snap.w, snap.h); res(); };
        img.src = snap.dataURL;
    });
    await drawSnap(products.A.snapshot, PROD_A_POS.x, PROD_A_POS.y);
    await drawSnap(products.B.snapshot, PROD_B_POS.x, PROD_B_POS.y);

    // 4. 品宣条置顶
    drawScaled(deco4Img, DECO4_POS.x, DECO4_POS.y, DECO4_POS.width);

    // 5. 文字
    const mainTitle = document.getElementById('mainTitle').value;
    const subTitle  = document.getElementById('subTitle').value;
    const highlight = document.getElementById('highlightWords').value;

    if (mainTitle) {
        ctx.font = `400 ${TEXT_STYLE.mainSize}px "POIZONSans", "PingFang SC"`;
        ctx.fillStyle = TEXT_STYLE.mainColor;
        ctx.textBaseline = 'top';
        let curX = TITLE_POS.x;
        for (const char of mainTitle) {
            ctx.fillText(char, curX, TITLE_POS.y);
            curX += ctx.measureText(char).width + 3;
        }
    }
    drawSubtitle(ctx, subTitle, SUBTITLE_POS.x, SUBTITLE_POS.y, TEXT_STYLE.subSize, TEXT_STYLE.subColor, highlight, TEXT_STYLE.highlightColor);

    // 更新右侧画布（不重置缩放，只刷新内容）
    displayResult(canvas, false);
}

// ═══════════════════════════════════════════════════
//  生成头图（触发下载用的完整渲染，复用 renderPreview 结果）
// ═══════════════════════════════════════════════════
async function generate() {
    if (!products.A.snapshot || !products.B.snapshot) {
        showStatus('请先上传并处理两张商品图'); return;
    }
    showStatus('生成中…', 0);
    await renderPreview();
    showStatus('✓ 生成完成');

    // 激活下载按钮，取右侧当前画布内容
    const inner = document.getElementById('canvasInner');
    const c = inner.querySelector('canvas');
    if (c) {
        const dlBtn = document.getElementById('downloadBtn');
        dlBtn.disabled = false;
        dlBtn._canvas = c;
    }
}

// ═══════════════════════════════════════════════════
//  右侧画布展示
// ═══════════════════════════════════════════════════
function displayResult(srcCanvas, resetView = true) {
    const inner = document.getElementById('canvasInner');
    document.getElementById('placeholder').style.display = 'none';

    // 复用已有 canvas 而不是每次新建，避免 dblclick 重复绑定
    let c = inner.querySelector('canvas');
    if (!c) {
        c = document.createElement('canvas');
        c.width = CANVAS_W; c.height = CANVAS_H;
        inner.appendChild(c);
        c.addEventListener('dblclick', () => {
            document.getElementById('lightboxImg').src = c.toDataURL('image/png');
            document.getElementById('lightboxOverlay').classList.add('show');
        });
    }
    c.getContext('2d').drawImage(srcCanvas, 0, 0);

    if (resetView) fitToView();
}

// ═══════════════════════════════════════════════════
//  画布缩放 & 拖拽
// ═══════════════════════════════════════════════════
let scale = 1, translateX = 0, translateY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0, dragOriginX = 0, dragOriginY = 0;
let isLocked = false;

function applyTransform() {
    const inner = document.getElementById('canvasInner');
    inner.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

function fitToView() {
    const panel = document.getElementById('rightPanel');
    const pw = panel.clientWidth - 80, ph = panel.clientHeight - 80;
    scale = Math.min(pw / CANVAS_W, ph / CANVAS_H, 1);
    translateX = 0; translateY = 0;
    applyTransform();
}

function setupCanvasControls() {
    const wrapper = document.getElementById('canvasWrapper');

    // 滚轮缩放
    wrapper.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.08 : 0.08;
        scale = Math.min(Math.max(scale + delta, 0.15), 4);
        applyTransform();
    }, { passive: false });

    // 拖拽
    wrapper.addEventListener('mousedown', e => {
        if (isLocked) return;
        isDragging = true;
        dragStartX = e.clientX; dragStartY = e.clientY;
        dragOriginX = translateX; dragOriginY = translateY;
        wrapper.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        translateX = dragOriginX + (e.clientX - dragStartX);
        translateY = dragOriginY + (e.clientY - dragStartY);
        applyTransform();
    });
    window.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        wrapper.style.cursor = isLocked ? 'default' : 'grab';
    });

    // 工具栏按钮
    document.getElementById('zoomInBtn').addEventListener('click', () => {
        scale = Math.min(scale + 0.15, 4); applyTransform();
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
        scale = Math.max(scale - 0.15, 0.15); applyTransform();
    });
    document.getElementById('zoomResetBtn').addEventListener('click', fitToView);
    document.getElementById('lockBtn').addEventListener('click', e => {
        isLocked = !isLocked;
        e.currentTarget.classList.toggle('active', isLocked);
        wrapper.style.cursor = isLocked ? 'default' : 'grab';
    });
}

// ═══════════════════════════════════════════════════
//  Lightbox
// ═══════════════════════════════════════════════════
function setupLightbox() {
    document.getElementById('lightboxOverlay').addEventListener('click', function() {
        this.classList.remove('show');
    });
}

// ═══════════════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════════════
(async () => {
    try {
        await loadAssets();
    } catch (e) {
        console.warn('部分素材加载失败', e);
    }
    initCategories();
    bindProductUpload('A');
    bindProductUpload('B');
    setupCanvasControls();
    setupLightbox();

    // 文字输入实时触发预览
    ['mainTitle', 'subTitle', 'highlightWords'].forEach(id => {
        document.getElementById(id).addEventListener('input', schedulePreview);
    });

    // 素材加载完后立即渲染底图
    renderPreview();

    document.getElementById('generateBtn').addEventListener('click', generate);

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const dlBtn = document.getElementById('downloadBtn');
        const canvas = dlBtn._canvas;
        if (!canvas) return;

        const limit = 300 * 1024;

        // 先尝试 PNG，超限则转 JPEG 逐步降质
        canvas.toBlob(blob => {
            if (blob.size <= limit) {
                triggerDownload(blob);
            } else {
                compressJpeg(canvas, 0.92);
            }
        }, 'image/png');

        function compressJpeg(src, quality) {
            src.toBlob(blob => {
                if (blob.size <= limit || quality <= 0.5) {
                    triggerDownload(blob);
                } else {
                    compressJpeg(src, parseFloat((quality - 0.06).toFixed(2)));
                }
            }, 'image/jpeg', quality);
        }

        function triggerDownload(blob) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `banner_${Date.now()}.png`;
            a.click();
            URL.revokeObjectURL(a.href);
        }
    });
})();
