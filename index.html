<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大促分会场 · 头图生成器</title>
    <style>
        @font-face {
            font-family: "POIZONSans";
            src: url("POIZONSans-Medium250109.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f5f5f5; margin: 0; padding: 0; overflow: hidden; }

        .main-container { display: flex; width: 100vw; height: 100vh; }

        /* 左侧面板 */
        .left-panel {
            width: 420px;
            background: white;
            overflow-y: auto;
            border-right: 1px solid #e0e0e0;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .left-panel::-webkit-scrollbar { width: 6px; }
        .left-panel::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        .panel-title { font-size: 18px; font-weight: 600; margin: 0 0 20px 0; color: #1a1a1a; }

        /* 品类选择 */
        .category-section { margin-bottom: 28px; }
        .section-label { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .category-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            background: white;
        }
        .category-card:hover { border-color: #06805c; }
        .category-card.active { border-color: #06805c; background: #f0f9f6; }
        .category-card img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
        .category-card label { font-size: 13px; color: #333; font-weight: 500; display: block; }

        /* 文案输入 */
        .text-section { margin-bottom: 28px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
            position: relative;
            z-index: 1;
            pointer-events: auto;
        }
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #06805c;
            box-shadow: 0 0 0 3px rgba(6, 128, 92, 0.1);
        }
        .input-group textarea { resize: vertical; min-height: 60px; }

        /* 商品上传 */
        .products-section { margin-bottom: 28px; }
        .product-upload { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .product-item {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .product-item:hover { border-color: #06805c; background: #f9f9f9; }
        .product-item input[type="file"] { display: none; }
        .product-item-label { font-size: 24px; display: block; margin-bottom: 4px; }
        .product-item-text { font-size: 11px; color: #666; }
        .product-item.loaded { border: 2px solid #06805c; background: #f0f9f6; }
        .product-item img { max-width: 100%; max-height: 60px; margin: 6px 0; border-radius: 4px; }

        .upload-hint {
            font-size: 11px;
            color: #999;
            line-height: 1.5;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }

        /* 精细调整 */
        .adjust-section { margin-bottom: 28px; }
        .adjust-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #06805c;
            cursor: pointer;
            user-select: none;
            padding: 6px 12px;
            background: #f0f9f6;
            border-radius: 20px;
            border: none;
        }
        .adjust-panel { display: none; }
        .adjust-panel.show { display: block; }
        .adjust-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .adjust-item label { min-width: 60px; color: #666; }
        .adjust-item input[type="range"] { flex: 1; }
        .adjust-item input[type="number"] { width: 50px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; }

        /* 下载按钮 */
        .download-btn {
            width: 100%;
            padding: 14px;
            background: #06805c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #056b4a; }
        .download-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 右侧画布 */
        .right-panel {
            flex: 1;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .canvas-toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 10;
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .toolbar-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }
        .toolbar-btn:hover { background: #f5f5f5; border-color: #06805c; }
        .toolbar-btn.active { background: #06805c; color: white; border-color: #06805c; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .canvas-container {
            position: relative;
            width: 1125px;
            height: 519px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            background: white;
            transform-origin: center;
            transition: transform 0.2s;
        }

        .canvas-container.locked { touch-action: none; }

        .canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .canvas-bg canvas { width: 100%; height: 100%; display: block; }

        .product-zone {
            position: absolute;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .product-zone:hover { box-shadow: inset 0 0 0 2px #06805c; }
        .product-zone canvas { width: 100%; height: 100%; display: block; }

        .product-controls {
            position: absolute;
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 8px;
            display: none;
            z-index: 100;
            font-size: 12px;
        }
        .product-controls.show { display: block; }
        .control-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .control-row:last-child { margin-bottom: 0; }
        .control-row label { min-width: 50px; }
        .control-row input[type="range"] { width: 120px; }
        .control-row input[type="number"] { width: 45px; padding: 2px 4px; }

        /* 响应式 */
        @media (max-width: 1400px) {
            .left-panel { width: 360px; }
            .canvas-container { width: 900px; height: 414px; }
        }
        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .left-panel { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid #e0e0e0; }
            .right-panel { height: 60%; }
        }
    </style>
</head>
<body>
<div class="main-container">
    <!-- 左侧面板 -->
    <div class="left-panel">
        <h1 class="panel-title">配置分会场头图</h1>

        <!-- 品类选择 -->
        <div class="category-section">
            <div class="section-label">品类选择</div>
            <div class="category-grid" id="categoryGrid"></div>
        </div>

        <!-- 文案输入 -->
        <div class="text-section">
            <div class="section-label">文案配置</div>
            <div class="input-group">
                <label>主标题（最多8字）</label>
                <input type="text" id="mainTitle" placeholder="例如：520新品" maxlength="8">
            </div>
            <div class="input-group">
                <label>副标题</label>
                <textarea id="subTitle" placeholder="例如：还在200测试"></textarea>
            </div>
            <div class="input-group">
                <label>高亮词（逗号分隔）</label>
                <input type="text" id="highlightWords" placeholder="例如：200,测试">
            </div>
        </div>

        <!-- 商品上传 -->
        <div class="products-section">
            <div class="section-label">商品图</div>
            <div class="product-upload">
                <div class="product-item" id="prodItem1" onclick="document.getElementById('file1').click()">
                    <label class="product-item-label">+</label>
                    <div class="product-item-text">选择商品A</div>
                    <input type="file" id="file1" class="prodFile" accept="image/*" data-prod="1">
                    <div class="prod-preview"></div>
                </div>
                <div class="product-item" id="prodItem2" onclick="document.getElementById('file2').click()">
                    <label class="product-item-label">+</label>
                    <div class="product-item-text">选择商品B</div>
                    <input type="file" id="file2" class="prodFile" accept="image/*" data-prod="2">
                    <div class="prod-preview"></div>
                </div>
            </div>
            <div class="upload-hint">
                📌 抠图效果不理想？可先去<a href="https://www.doubao.com/chat/create-image" target="_blank" style="color:#06805c;text-decoration:none;">豆包 AI 抠图</a>处理后下载 PNG 再上传，自动跳过抠图 ✨
            </div>
        </div>

        <!-- 精细调整 -->
        <div class="adjust-section" id="adjustSection" style="display:none;">
            <button class="adjust-toggle" id="adjustToggle">🔧 精细调整</button>
            <div class="adjust-panel" id="adjustPanel">
                <div style="font-size:12px;color:#666;margin-bottom:12px;margin-top:8px;">商品A</div>
                <div class="adjust-item">
                    <label>缩放(%):</label>
                    <input type="range" min="30" max="200" value="100" class="scale-slider" data-prod="1">
                    <input type="number" min="30" max="200" value="100" class="scale-num" data-prod="1">
                </div>
                <div class="adjust-item">
                    <label>垂直(px):</label>
                    <input type="range" min="-150" max="150" value="0" class="offset-slider" data-prod="1">
                    <input type="number" min="-150" max="150" value="0" class="offset-num" data-prod="1">
                </div>
                <div class="adjust-item">
                    <label>水平(px):</label>
                    <input type="range" min="-150" max="150" value="0" class="offsetx-slider" data-prod="1">
                    <input type="number" min="-150" max="150" value="0" class="offsetx-num" data-prod="1">
                </div>

                <div style="font-size:12px;color:#666;margin-bottom:12px;margin-top:16px;">商品B</div>
                <div class="adjust-item">
                    <label>缩放(%):</label>
                    <input type="range" min="30" max="200" value="100" class="scale-slider" data-prod="2">
                    <input type="number" min="30" max="200" value="100" class="scale-num" data-prod="2">
                </div>
                <div class="adjust-item">
                    <label>垂直(px):</label>
                    <input type="range" min="-150" max="150" value="0" class="offset-slider" data-prod="2">
                    <input type="number" min="-150" max="150" value="0" class="offset-num" data-prod="2">
                </div>
                <div class="adjust-item">
                    <label>水平(px):</label>
                    <input type="range" min="-150" max="150" value="0" class="offsetx-slider" data-prod="2">
                    <input type="number" min="-150" max="150" value="0" class="offsetx-num" data-prod="2">
                </div>
            </div>
        </div>

        <!-- 下载按钮 -->
        <button class="download-btn" id="downloadBtn">📥 下载头图</button>
    </div>

    <!-- 右侧画布 -->
    <div class="right-panel">
        <div class="canvas-toolbar">
            <button class="toolbar-btn" id="zoomInBtn" title="放大">+</button>
            <button class="toolbar-btn" id="zoomOutBtn" title="缩小">−</button>
            <button class="toolbar-btn" id="lockBtn" title="固定画布">🔒</button>
        </div>
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="canvas-container" id="canvasContainer">
                <div class="canvas-bg" id="canvasBg"></div>
            </div>
        </div>
    </div>
</div>

<script>
// 抠图库懒加载，仅在实际需要时才从网络获取，不阻塞页面初始化
let _removeBackground = null;
async function getRemoveBackground() {
    if (_removeBackground) return _removeBackground;
    const mod = await import('https://esm.run/@imgly/background-removal');
    _removeBackground = mod.removeBackground;
    return _removeBackground;
}

const CANVAS_W = 1125, CANVAS_H = 519;
const DECO4_POS = { x: 720, y: 449, width: 340 };
const DECO_LEFT_POS = { x: 537, y: 307, width: 210 };
const DECO_RIGHT_POS = { x: 895, y: 307, width: 210 };
const PREVIEW_W = 268, PREVIEW_H = 300;
const RIGHT_MARGIN = 234, BOTTOM_MARGIN = 21, PROD2_OFFSET_X = 138;
const TITLE_POS = { x: 42, y: 268 };
const SUBTITLE_POS = { x: 42, y: 370 };

let currentCategory = '其他';
let currentTemplate = 'template';
let templateImg = null;
let backgroundImg = null;
let decoLeft = null, decoRight = null, deco4Img = null;
let products = { 1: { noBg: null, snapshot: null }, 2: { noBg: null, snapshot: null } };
let adjustments = { 1: { scale: 100, offset: 0, offsetX: 0 }, 2: { scale: 100, offset: 0, offsetX: 0 } };
let canvasScale = 1;
let canvasLocked = false;

const categories = [
    { label: '其他', value: '其他', template: 'template' },
    { label: '鞋类', value: '鞋类', template: 'template' }
];

// 加载素材
async function loadAssets() {
    const loadImage = (path) => new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = path;
    });

    // background.png 是底图（透明PNG，含背景色+底纹）；template.png 仅用于左侧品类缩略图展示
    backgroundImg = await loadImage('background.png');
    decoLeft = await loadImage('deco_left_A.png');
    decoRight = await loadImage('deco_right_A.png');
    deco4Img = await loadImage('deco4.png');

    // 等待 POIZONSans 字体加载完成，确保 Canvas 绘制时字体已就绪
    try {
        await document.fonts.load('400 69px "POIZONSans"');
    } catch(e) {
        console.warn('字体加载失败，将使用系统字体', e);
    }
}

// 初始化品类选择
function initCategories() {
    const grid = document.getElementById('categoryGrid');
    categories.forEach(cat => {
        const card = document.createElement('div');
        card.className = `category-card ${cat.value === currentCategory ? 'active' : ''}`;
        card.innerHTML = `<img src="${cat.template}.png"><label>${cat.label}</label>`;
        card.addEventListener('click', () => selectCategory(cat.value, cat.template, card));
        grid.appendChild(card);
    });
}

function selectCategory(value, template, element) {
    currentCategory = value;
    currentTemplate = template;
    document.querySelectorAll('.category-card').forEach(e => e.classList.remove('active'));
    element.classList.add('active');
    render();
}

// 处理文件上传
function bindProductUpload() {
    document.querySelectorAll('.prodFile').forEach(input => {
        input.addEventListener('change', async (e) => {
            const prod = e.target.dataset.prod;
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById(`prodItem${prod}`).classList.add('loaded');

            const isPng = file.type === 'image/png' || file.name.toLowerCase().endsWith('.png');
            const hasTransparency = isPng && await checkTransparency(file);

            let noBg;
            if (hasTransparency) {
                noBg = await loadPngWithoutBg(file);
            } else {
                const itemEl = document.getElementById(`prodItem${prod}`);
                itemEl.querySelector('.product-item-text').textContent = '抠图中…';
                try {
                    const removeBackground = await getRemoveBackground();
                    noBg = await removeBackground(file, { output: { format: 'image/png', quality: 1 } })
                        .then(blob => loadFromBlob(blob));
                } catch(err) {
                    itemEl.querySelector('.product-item-text').textContent = '抠图失败，请上传透明PNG';
                    console.error('抠图失败:', err);
                    return;
                }
                itemEl.querySelector('.product-item-text').textContent = '抠图完成';
            }

            products[prod].noBg = noBg;
            const scale = calcAutoScale(noBg);
            adjustments[prod].scale = Math.round(scale * 100);
            document.querySelector(`.scale-num[data-prod="${prod}"]`).value = adjustments[prod].scale;
            document.querySelector(`.scale-slider[data-prod="${prod}"]`).value = adjustments[prod].scale;

            updatePreview(prod);
            document.getElementById('adjustSection').style.display = 'block';
            render();
        });
    });
}

async function checkTransparency(file) {
    return new Promise(res => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const d = ctx.getImageData(0, 0, c.width, c.height).data;
            for (let i = 3; i < d.length; i += 32) {
                if (d[i] < 250) { res(true); return; }
            }
            res(false);
        };
        img.onerror = () => res(false);
        img.src = url;
    });
}

async function loadPngWithoutBg(file) {
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const wmX = Math.floor(c.width * 0.80);
            const wmY = Math.floor(c.height * 0.92);
            ctx.clearRect(wmX, wmY, c.width - wmX, c.height - wmY);
            res(c);
        };
        img.onerror = rej;
        img.src = url;
    });
}

async function loadFromBlob(blob) {
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            res(c);
        };
        img.onerror = rej;
        img.src = url;
    });
}

function getTrimBounds(canvas) {
    const ctx = canvas.getContext('2d');
    const { width: w, height: h } = canvas;
    const d = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = 0, maxY = 0;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            if (d[(y * w + x) * 4 + 3] > 10) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
        }
    }
    if (maxX < minX) return null;
    return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

function calcAutoScale(noBgCanvas) {
    const bounds = getTrimBounds(noBgCanvas);
    if (!bounds) return 1;
    const scaleByW = PREVIEW_W / bounds.w;
    const scaledH = bounds.h * scaleByW;
    return scaledH <= PREVIEW_H ? scaleByW : PREVIEW_H / bounds.h;
}

function updatePreview(prod) {
    const noBg = products[prod].noBg;
    if (!noBg) return;

    const c = document.createElement('canvas');
    c.width = PREVIEW_W; c.height = PREVIEW_H;
    const ctx = c.getContext('2d');

    const bounds = getTrimBounds(noBg);
    const scale = adjustments[prod].scale / 100;
    const offset = adjustments[prod].offset;
    const offsetX = adjustments[prod].offsetX;

    const drawW = Math.round(bounds.w * scale);
    const drawH = Math.round(bounds.h * scale);
    const dx = (PREVIEW_W - drawW) / 2 + offsetX;
    const dy = PREVIEW_H - drawH + offset;

    ctx.drawImage(noBg, bounds.x, bounds.y, bounds.w, bounds.h, dx, dy, drawW, drawH);
    products[prod].snapshot = c.toDataURL('image/png');
}

function bindAdjustments() {
    ['scale-slider', 'scale-num', 'offset-slider', 'offset-num', 'offsetx-slider', 'offsetx-num'].forEach(cls => {
        document.querySelectorAll(`.${cls}`).forEach(el => {
            el.addEventListener('input', (e) => {
                const prod = e.target.dataset.prod;
                const type = cls.split('-')[0];
                const value = parseInt(e.target.value);
                adjustments[prod][type === 'scale' ? 'scale' : type === 'offset' ? 'offset' : 'offsetX'] = value;

                const pair = cls.includes('slider') ? document.querySelector(`.${cls.replace('slider', 'num')}[data-prod="${prod}"]`)
                    : document.querySelector(`.${cls.replace('num', 'slider')}[data-prod="${prod}"]`);
                if (pair) pair.value = value;

                updatePreview(prod);
                render();
            });
        });
    });
}

function bindTextInputs() {
    ['mainTitle', 'subTitle', 'highlightWords'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
    });
}

async function render() {
    const canvas = document.createElement('canvas');
    canvas.width = CANVAS_W; canvas.height = CANVAS_H;
    const ctx = canvas.getContext('2d');

    // 第1层：背景底图（含底色+底纹）
    ctx.drawImage(backgroundImg, 0, 0, CANVAS_W, CANVAS_H);

    // 第2层：左右装饰元素
    ctx.drawImage(decoLeft, DECO_LEFT_POS.x, DECO_LEFT_POS.y, DECO_LEFT_POS.width, Math.round(DECO_LEFT_POS.width * decoLeft.height / decoLeft.width));
    ctx.drawImage(decoRight, DECO_RIGHT_POS.x, DECO_RIGHT_POS.y, DECO_RIGHT_POS.width, Math.round(DECO_RIGHT_POS.width * decoRight.height / decoRight.width));

    // 第4层：商品图
    await drawProducts(ctx);

    // 第5层：文字
    drawText(ctx);

    // 第6层：品宣条 deco4 置顶
    ctx.drawImage(deco4Img, DECO4_POS.x, DECO4_POS.y, DECO4_POS.width, Math.round(DECO4_POS.width * deco4Img.height / deco4Img.width));

    displayCanvas(canvas);
}

function drawProducts(ctx) {
    return new Promise(res => {
        if (!products[1].snapshot) { res(); return; }
        const img1 = new Image();
        img1.onload = () => {
            ctx.drawImage(img1, CANVAS_W - RIGHT_MARGIN - PREVIEW_W, CANVAS_H - BOTTOM_MARGIN - PREVIEW_H, PREVIEW_W, PREVIEW_H);
            if (!products[2].snapshot) { res(); return; }
            const img2 = new Image();
            img2.onload = () => {
                ctx.drawImage(img2, CANVAS_W - RIGHT_MARGIN - PREVIEW_W + PROD2_OFFSET_X, CANVAS_H - BOTTOM_MARGIN - PREVIEW_H, PREVIEW_W, PREVIEW_H);
                res();
            };
            img2.src = products[2].snapshot;
        };
        img1.src = products[1].snapshot;
    });
}

function drawText(ctx) {
    const title = document.getElementById('mainTitle').value;
    const subtitle = document.getElementById('subTitle').value;
    const highlight = document.getElementById('highlightWords').value;

    if (title) {
        ctx.font = '400 69px "POIZONSans", "PingFang SC"';
        ctx.fillStyle = '#000000';
        ctx.textBaseline = 'top';
        let curX = TITLE_POS.x;
        for (const char of title) {
            ctx.fillText(char, curX, TITLE_POS.y);
            curX += ctx.measureText(char).width + 3;
        }
    }

    if (subtitle) {
        const words = highlight.split(',').map(w => w.trim()).filter(Boolean);
        ctx.font = '400 36px "PingFang SC"';
        ctx.fillStyle = '#000000';
        ctx.textBaseline = 'top';
        const regex = new RegExp(`(${words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
        const parts = [];
        let last = 0, m;
        while ((m = regex.exec(subtitle)) !== null) {
            if (m.index > last) parts.push({ t: subtitle.slice(last, m.index), hi: false });
            parts.push({ t: m[0], hi: true });
            last = regex.lastIndex;
        }
        if (last < subtitle.length) parts.push({ t: subtitle.slice(last), hi: false });

        let curX = SUBTITLE_POS.x;
        parts.forEach(p => {
            ctx.font = `${p.hi ? 500 : 400} 36px "PingFang SC"`;
            ctx.fillStyle = p.hi ? '#FF0000' : '#000000';
            ctx.fillText(p.t, curX, SUBTITLE_POS.y);
            curX += ctx.measureText(p.t).width;
        });
    }
}

function displayCanvas(canvas) {
    const bg = document.getElementById('canvasBg');
    bg.innerHTML = '';
    const c = document.createElement('canvas');
    c.width = CANVAS_W; c.height = CANVAS_H;
    const ctx = c.getContext('2d');
    ctx.drawImage(canvas, 0, 0);
    bg.appendChild(c);
}

// 画布控制
function setupCanvasControls() {
    const container = document.getElementById('canvasContainer');
    const wrapper = document.getElementById('canvasWrapper');

    document.getElementById('zoomInBtn').addEventListener('click', () => {
        canvasScale = Math.min(canvasScale + 0.1, 2);
        container.style.transform = `scale(${canvasScale})`;
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
        canvasScale = Math.max(canvasScale - 0.1, 0.5);
        container.style.transform = `scale(${canvasScale})`;
    });

    document.getElementById('lockBtn').addEventListener('click', (e) => {
        canvasLocked = !canvasLocked;
        container.classList.toggle('locked', canvasLocked);
        e.target.classList.toggle('active', canvasLocked);
        wrapper.style.overflow = canvasLocked ? 'auto' : 'auto';
    });
}

// 下载
document.getElementById('downloadBtn').addEventListener('click', async () => {
    const canvas = document.createElement('canvas');
    canvas.width = CANVAS_W; canvas.height = CANVAS_H;
    const ctx = canvas.getContext('2d');

    // 保持与 render() 完全相同的层级顺序
    ctx.drawImage(backgroundImg, 0, 0, CANVAS_W, CANVAS_H);
    ctx.drawImage(decoLeft, DECO_LEFT_POS.x, DECO_LEFT_POS.y, DECO_LEFT_POS.width, Math.round(DECO_LEFT_POS.width * decoLeft.height / decoLeft.width));
    ctx.drawImage(decoRight, DECO_RIGHT_POS.x, DECO_RIGHT_POS.y, DECO_RIGHT_POS.width, Math.round(DECO_RIGHT_POS.width * decoRight.height / decoRight.width));

    await drawProducts(ctx);
    drawText(ctx);

    // deco4 品宣条置顶
    ctx.drawImage(deco4Img, DECO4_POS.x, DECO4_POS.y, DECO4_POS.width, Math.round(DECO4_POS.width * deco4Img.height / deco4Img.width));

    // 压缩至 300KB
    canvas.toBlob(blob => {
        if (blob.size <= 300 * 1024) {
            download(blob);
        } else {
            const c2 = document.createElement('canvas');
            c2.width = CANVAS_W; c2.height = CANVAS_H;
            const ctx2 = c2.getContext('2d');
            ctx2.drawImage(canvas, 0, 0);
            let quality = 0.85;
            const compress = () => {
                c2.toBlob(blob2 => {
                    if (blob2.size <= 300 * 1024 || quality <= 0.5) {
                        download(blob2);
                    } else {
                        quality -= 0.1;
                        compress();
                    }
                }, 'image/jpeg', quality);
            };
            compress();
        }
    }, 'image/png');

    function download(blob) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `banner_${Date.now()}.png`;
        a.click();
    }
});

// 初始化
(async () => {
    await loadAssets();
    initCategories();
    bindProductUpload();
    bindAdjustments();
    bindTextInputs();
    setupCanvasControls();
    render();
})();
</script>
