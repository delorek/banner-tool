<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大促分会场 · 头图生成器</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/d-din');
        @import url('https://fonts.googleapis.com/css2?family=Alibaba+PuHuiTi+3.0:wght@500&display=swap');
        @font-face {
            font-family: "POIZONSans";
            src: url("POIZONSans-Medium250109.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: "D-DIN-PRO";
            src: url("D-DIN-PRO-600-SemiBold.otf") format("opentype");
            font-weight: 600;
            font-style: normal;
            font-display: block;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f5f5f5; margin: 0; padding: 0; overflow: hidden; }

        .main-container { display: flex; width: 100vw; height: 100vh; }

        /* ── 左侧面板 ── */
        .left-panel {
            width: 460px;
            background: white;
            overflow-y: auto;
            border-right: 1px solid #e0e0e0;
            padding: 28px 24px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.04);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .left-panel::-webkit-scrollbar { width: 4px; }
        .left-panel::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

        .panel-title { font-size: 17px; font-weight: 700; color: #1a1a1a; margin: 0; }

        .section-label {
            font-size: 15px; font-weight: 700; color: #1a1a1a;
            letter-spacing: 0.2px; margin-bottom: 12px;
        }
        .section-label-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .section-label-row .section-label { margin-bottom: 0; }

        .swap-btn {
            padding: 4px 10px; background: #f5f5f5; color: #888;
            border: 1px solid #e0e0e0; border-radius: 5px;
            font-size: 11px; cursor: pointer; transition: all 0.15s;
            white-space: nowrap;
        }
        .swap-btn:hover { background: #e8e8e8; border-color: #ccc; color: #555; }

        /* ── 品类选择 — 单选按钮组 ── */
        .category-radio-group { display: flex; gap: 24px; align-items: center; }
        .category-radio-item { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
        .category-radio-item input[type="radio"] { display: none; }
        .radio-circle {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid #ccc; background: white;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s;
            flex-shrink: 0;
        }
        .radio-circle::after {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: #06805c; opacity: 0; transition: opacity 0.15s;
        }
        .category-radio-item input[type="radio"]:checked + .radio-circle { border-color: #06805c; }
        .category-radio-item input[type="radio"]:checked + .radio-circle::after { opacity: 1; }
        .radio-label { font-size: 13px; color: #48484D; font-weight: 600; }

        /* ── 商品图 ── */
        .product-pair { margin-bottom: 8px; }
        .pair-upload { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }

        /* 可点击上传画框 */
        .upload-item {
            background: white; border-radius: 8px; border: 1.5px dashed #d0d0d0;
            cursor: pointer; position: relative; transition: border-color 0.15s;
            display: flex; flex-direction: column;
            min-height: 160px;
        }
        .upload-item:hover { border-color: #06805c; }
        .upload-item.has-image { border-style: solid; border-color: #c8e8df; }
        .upload-item.is-processing,
        .upload-item.is-processing input[type="file"] { cursor: progress; }
        .upload-item input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }

        /* 空态占位 — 撑满整个画框 */
        .upload-placeholder {
            flex: 1;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 6px; pointer-events: none;
            min-height: 160px;
        }
        .upload-placeholder .plus { font-size: 24px; color: #c0c0c0; line-height: 1; }
        .upload-item-label {
            font-size: 12px; font-weight: 600; color: #aaa;
            text-align: center; pointer-events: none;
        }
        /* 有图后隐藏占位 */
        .upload-item.has-image .upload-placeholder { display: none; }

        .prod-preview-canvas-wrap { display: none; flex-direction: column; }
        .upload-item.has-image .prod-preview-canvas-wrap { display: flex; }
        .prod-preview-canvas-wrap canvas {
            display: block; width: 100% !important; height: auto !important;
            border-radius: 7px; background: #f4f4f4; cursor: zoom-in;
        }
        .preview-hint { font-size: 10px; color: #bbb; margin: 4px 8px 6px; line-height: 1.5; }

        /* 精细调整 — 放在画框外部 */
        .adv-toggle {
            font-size: 11px; color: #06805c; cursor: pointer;
            margin-top: 6px; display: inline-flex; align-items: center; gap: 4px;
            user-select: none;
        }
        .adv-toggle::before { content: '▶'; font-size: 9px; transition: transform 0.2s; }
        .adv-toggle.open::before { transform: rotate(90deg); }
        .advanced-options {
            margin-top: 4px; padding: 10px; background: #f0f9f6;
            border-radius: 8px; display: none; border: 1px solid #c8e8df;
        }
        .advanced-options.show { display: block; }
        .control-group { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .control-group:last-child { margin-bottom: 0; }
        .control-group label { font-size: 11px; font-weight: 600; min-width: 64px; color: #555; }
        .control-group input[type="range"] { flex: 1; min-width: 60px; }
        .control-group input[type="number"] { width: 50px; padding: 3px 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 11px; }

        /* 文案 */
        .text-section { display: flex; flex-direction: column; gap: 16px; }
        .text-block label { display: block; font-size: 13px; font-weight: 700; color: #48484D; margin-bottom: 6px; }
        .text-input {
            width: 100%; padding: 11px 12px; border: 1px solid #ddd;
            border-radius: 7px; font-size: 13px; background: white;
            color: #48484D; transition: border-color 0.15s;
        }
        .text-input::placeholder { color: #c8c8c8; }
        .text-input:focus { outline: none; border-color: #06805c; box-shadow: 0 0 0 3px rgba(6,128,92,0.08); }

        /* ── 左侧面板模块分隔 ── */
        .panel-section {
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        /* 头图品类和文案配置之间保留清晰层级 */
        #bannerPanel {
            display: flex;
            flex-direction: column;
        }
        #bannerPanel > .panel-title { margin-bottom: 14px; }
        #bannerPanel > .panel-section.section-cat {
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        #couponPanel {
            display: flex;
            flex-direction: column;
        }
        #couponPanel > .panel-title { margin-bottom: 32px; }
        /* 文案→商品图 去掉分隔线，间距小一点 */
        .panel-section.section-text { border-bottom: none; padding-bottom: 14px; }
        .panel-section:last-of-type { border-bottom: none; padding-bottom: 0; }

        .upload-hint {
            font-size: 11px; color: #aaa; line-height: 1.7;
            background: #f5f5f5; border-radius: 7px;
            padding: 10px 12px; margin-top: 14px;
        }

        /* ── 按钮区 ── */
        .btn-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
        }
        .gen-btn {
            padding: 13px; background: #06805c; color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .gen-btn:hover { background: #056b4a; }
        .gen-btn:active { background: #044f37; }
        .gen-btn:disabled,
        .gen-btn:disabled:hover,
        .gen-btn:disabled:active {
            background: #ABDCCA;
            cursor: not-allowed;
        }

        .dl-btn {
            padding: 13px; background: #313133; color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .dl-btn:hover { background: #444446; }
        .dl-btn:active { background: #1e1e1f; }
        .dl-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* ── 右侧画布 ── */
        .right-panel {
            flex: 1; background: #ebebeb;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        /* 工具栏 */
        .canvas-toolbar {
            position: absolute; top: 16px; right: 16px;
            display: flex; gap: 6px; z-index: 20;
            background: white; padding: 6px 8px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .toolbar-btn {
            width: 30px; height: 30px; border: 1px solid #e0e0e0;
            background: white; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; transition: all 0.15s; color: #444;
        }
        .toolbar-btn:hover { background: #f5f5f5; border-color: #06805c; color: #06805c; }
        .toolbar-btn.active { background: #06805c; color: white; border-color: #06805c; }

        /* 画布容器（可缩放拖拽） */
        .canvas-wrapper {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; cursor: grab;
        }
        .canvas-wrapper.locked { cursor: default; }
        .canvas-inner {
            transform-origin: center center;
            transition: none;
            position: relative;
        }
        .canvas-inner canvas {
            display: block;
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }

        /* 状态提示 */
        .status-bar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,30,0.82); color: white;
            padding: 8px 18px; border-radius: 20px; font-size: 13px;
            white-space: nowrap; pointer-events: none;
            opacity: 0; transition: opacity 0.3s;
        }
        .status-bar.show { opacity: 1; }

        /* lightbox */
        .lightbox-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.78); z-index: 9999;
            align-items: center; justify-content: center; cursor: zoom-out;
        }
        .lightbox-overlay.show { display: flex; }
        .lightbox-overlay img {
            max-width: 92vw; max-height: 92vh;
            border-radius: 10px; object-fit: contain;
            box-shadow: 0 12px 48px rgba(0,0,0,0.5);
        }

        /* 空态提示 */
        .canvas-placeholder {
            color: #c0c0c0; font-size: 14px; text-align: center; pointer-events: none;
        }
        .canvas-placeholder svg { display: block; margin: 0 auto 12px; opacity: 0.35; }

        /* ── 模式切换 Tab ── */
        .tab-bar {
            display: flex;
            gap: 0;
            margin-bottom: 14px;
            padding: 4px;
            background: #F2F8F7;
            border: none;
            border-radius: 10px;
        }
        .tab-btn {
            flex: 1 1 0;
            min-height: 48px;
            margin: 0;
            padding: 0 18px;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: #77A599;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .15s, color .15s, box-shadow .15s;
        }
        .tab-btn:hover { color: #294331; }
        .tab-btn.active {
            background: #FFFFFF;
            border: 1px solid rgba(41, 67, 49, .04);
            box-shadow: 0 1px 3px rgba(41, 67, 49, .06);
            color: #294331;
            font-weight: 700;
        }

        /* ── 优惠券画布 ── */
        .coupon-area {
            position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            padding:24px; overflow:hidden;
        }
        .coupon-area canvas {
            max-width:100%; max-height:100%; height:auto;
            border-radius:8px; box-shadow:0 8px 32px rgba(0,0,0,0.18);
        }
    </style>
</head>
<body>
<div class="main-container">

    <!-- ══ 左侧面板 ══ -->
    <div class="left-panel">
        <!-- 模式切换 -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabBannerBtn">生成头图</button>
            <button class="tab-btn" id="tabCouponBtn">生成优惠券</button>
        </div>
        <div id="bannerPanel" class="mode-panel">
        <h1 class="panel-title">配置分会场头图</h1>

        <!-- 品类选择 -->
        <div class="panel-section section-cat">
            <div class="category-radio-group" id="categoryGrid">
                <label class="category-radio-item">
                    <input type="radio" name="category" value="other">
                    <span class="radio-circle"></span>
                    <span class="radio-label">其他品类</span>
                </label>
                <label class="category-radio-item">
                    <input type="radio" name="category" value="shoes">
                    <span class="radio-circle"></span>
                    <span class="radio-label">鞋类</span>
                </label>
            </div>
        </div>

        <!-- 文案 -->
        <div class="panel-section section-text">
            <div class="section-label">✏️ 文案配置</div>
            <div class="text-section">
                <div class="text-block">
                    <label>主标题（最多 9 字）</label>
                    <input type="text" class="text-input" id="mainTitle" placeholder="520奢包特惠">
                </div>
                <div class="text-block">
                    <label>副标题</label>
                    <input type="text" class="text-input" id="subTitle" placeholder="最高减450 享12期分期">
                </div>
                <div class="text-block">
                    <label>高亮词（空格分隔）</label>
                    <input type="text" class="text-input" id="highlightWords" placeholder="450 低至一折">
                </div>
            </div>
        </div>

        <!-- 商品图 -->
        <div class="panel-section">
            <div class="section-label-row">
                <span class="section-label">🛍️ 商品图</span>
                <button class="swap-btn" id="swapBtn">⇄ 互换</button>
            </div>
            <div class="product-pair">
                <div class="pair-upload">
                    <!-- 商品 A -->
                    <div class="upload-item" id="uploadItemA">
                        <input type="file" id="fileA" accept="image/*">
                        <div class="upload-placeholder">
                            <span class="plus">+</span>
                            <span class="upload-item-label">商品 A（底层）</span>
                        </div>
                        <div class="prod-preview-canvas-wrap">
                            <canvas id="previewCanvasA" width="268" height="300"></canvas>
                            <div class="preview-hint">点击更换图片</div>
                        </div>
                    </div>
                    <!-- 商品 B -->
                    <div class="upload-item" id="uploadItemB">
                        <input type="file" id="fileB" accept="image/*">
                        <div class="upload-placeholder">
                            <span class="plus">+</span>
                            <span class="upload-item-label">商品 B（上层）</span>
                        </div>
                        <div class="prod-preview-canvas-wrap">
                            <canvas id="previewCanvasB" width="268" height="300"></canvas>
                            <div class="preview-hint">点击更换图片</div>
                        </div>
                    </div>
                </div>
                <!-- 精细调整放画框外 -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div>
                        <span class="adv-toggle" id="advToggleA">精细调整</span>
                        <div class="advanced-options" id="advPanelA">
                            <div class="control-group">
                                <label>缩放(%):</label>
                                <input type="range" min="30" max="200" value="100" id="scaleSliderA">
                                <input type="number" min="30" max="200" value="100" id="scaleNumA">
                            </div>
                            <div class="control-group">
                                <label>垂直偏移:</label>
                                <input type="range" min="-150" max="150" value="0" id="offsetSliderA">
                                <input type="number" min="-150" max="150" value="0" id="offsetNumA">
                            </div>
                            <div class="control-group">
                                <label>横向偏移:</label>
                                <input type="range" min="-150" max="150" value="0" id="offsetxSliderA">
                                <input type="number" min="-150" max="150" value="0" id="offsetxNumA">
                            </div>
                            <div class="control-group">
                                <label>亮度(%):</label>
                                <input type="range" min="50" max="150" value="100" id="briSliderA">
                                <input type="number" min="50" max="150" value="100" id="briNumA">
                            </div>
                        </div>
                    </div>
                    <div>
                        <span class="adv-toggle" id="advToggleB">精细调整</span>
                        <div class="advanced-options" id="advPanelB">
                            <div class="control-group">
                                <label>缩放(%):</label>
                                <input type="range" min="30" max="200" value="100" id="scaleSliderB">
                                <input type="number" min="30" max="200" value="100" id="scaleNumB">
                            </div>
                            <div class="control-group">
                                <label>垂直偏移:</label>
                                <input type="range" min="-150" max="150" value="0" id="offsetSliderB">
                                <input type="number" min="-150" max="150" value="0" id="offsetNumB">
                            </div>
                            <div class="control-group">
                                <label>横向偏移:</label>
                                <input type="range" min="-150" max="150" value="0" id="offsetxSliderB">
                                <input type="number" min="-150" max="150" value="0" id="offsetxNumB">
                            </div>
                            <div class="control-group">
                                <label>亮度(%):</label>
                                <input type="range" min="50" max="150" value="100" id="briSliderB">
                                <input type="number" min="50" max="150" value="100" id="briNumB">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="upload-hint">
                    📌 抠图效果不理想？可先去<a href="https://www.doubao.com/chat/create-image" target="_blank" style="color:#06805c;text-decoration:none;">豆包 AI 抠图</a>处理后下载 PNG 再上传，自动跳过抠图 ✨
                </div>
            </div>
        </div>

        <!-- 按钮区 -->
        <div class="btn-row">
            <button class="gen-btn" id="generateBtn" disabled>生成头图</button>
            <button class="dl-btn" id="downloadBtn" disabled>下载</button>
        </div>
        </div>

        <!-- 优惠券配置 -->
        <div id="couponPanel" class="mode-panel" style="display:none">
            <h1 class="panel-title">优惠券生成</h1>
            <div class="panel-section section-text">
                <div class="text-section">
                    <div class="text-block">
                        <label>金额</label>
                        <input type="text" class="text-input" id="couponAmount" maxlength="12" placeholder="如 100 / ¥100">
                    </div>
                    <input type="hidden" id="couponText" value="官方限时优惠券">
                </div>
            </div>
            <div class="btn-row">
                <button class="gen-btn" id="couponGenBtn">生成优惠券</button>
                <button class="dl-btn" id="couponDlBtn">下载</button>
            </div>
        </div>
    </div>

    <!-- ══ 右侧画布 ══ -->
    <div class="right-panel" id="rightPanel">
        <!-- 工具栏 -->
        <div class="canvas-toolbar">
            <button class="toolbar-btn" id="zoomInBtn" title="放大">+</button>
            <button class="toolbar-btn" id="zoomOutBtn" title="缩小">−</button>
            <button class="toolbar-btn" id="zoomResetBtn" title="重置缩放">⊙</button>
            <button class="toolbar-btn" id="lockBtn" title="锁定/解锁拖动">🔒</button>
        </div>

        <!-- 可拖拽缩放区 -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="canvas-inner" id="canvasInner">
                <div class="canvas-placeholder" id="placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
                    </svg>
                    点击「生成头图」查看效果
                </div>
            </div>
        </div>

        <div class="status-bar" id="statusBar"></div>

        <!-- 优惠券画布 -->
        <div class="coupon-area" id="couponArea" style="display:none">
            <canvas id="couponCanvas" width="1053" height="153"></canvas>
        </div>
    </div>
</div>

<!-- lightbox -->
<div class="lightbox-overlay" id="lightboxOverlay">
    <img id="lightboxImg" src="" alt="大图预览">
</div>

<script type="module">
import { removeBackground } from 'https://esm.run/@imgly/background-removal@1.7.0';

// 线上环境：模型与 ONNX Runtime 资源随页面同域发布，兼容 GitHub Pages 的仓库子路径。
// 直接双击 index.html（file://）时，浏览器出于安全限制无法 fetch 本地模型分片，
// 因此仅在本地文件预览时回退到官方资源；线上发布仍完全使用自行托管资源。
const BG_ASSET_PUBLIC_PATH = window.location.protocol === 'file:'
    ? 'https://staticimgly.com/@imgly/background-removal-data/1.7.0/dist/'
    : new URL('./assets/bg-removal/', document.baseURI).href;

// ═══════════════════════════════════════════════════
//  常量 & 状态
// ═══════════════════════════════════════════════════
const CANVAS_W = 1125, CANVAS_H = 519;
const DECO4_POS      = { x: 720,  y: 449, width: 340 };
const DECO_LEFT_POS  = { x: 531,  y: 307, width: 210 };
const DECO_RIGHT_POS = { x: 895,  y: 307, width: 210 };
const PREVIEW_W = 268, PREVIEW_H = 300;
const PROD_A_POS = { x: 607, y: 198 };
const PROD_B_POS = { x: 780, y: 198 };

let currentCat = null;

// 按品类保存/恢复状态
const categoryState = {};

function saveCategoryState(cat) {
    const state = {
        mainTitle: document.getElementById('mainTitle').value,
        subTitle:  document.getElementById('subTitle').value,
        highlight: document.getElementById('highlightWords').value,
        A: { noBg: products.A.noBg, snapshot: products.A.snapshot },
        B: { noBg: products.B.noBg, snapshot: products.B.snapshot },
        sliders: {},
    };
    ['scaleSlider','scaleNum','offsetSlider','offsetNum','offsetxSlider','offsetxNum','briSlider','briNum'].forEach(cls => {
        ['A','B'].forEach(side => {
            const el = document.getElementById(`${cls}${side}`);
            if (el) state.sliders[`${cls}${side}`] = el.value;
        });
    });
    categoryState[cat] = state;
}

function restoreCategoryState(cat) {
    const state = categoryState[cat];
    if (state) {
        document.getElementById('mainTitle').value = state.mainTitle || '';
        document.getElementById('subTitle').value  = state.subTitle  || '';
        document.getElementById('highlightWords').value = state.highlight || '';
        products.A = { noBg: state.A.noBg, snapshot: state.A.snapshot };
        products.B = { noBg: state.B.noBg, snapshot: state.B.snapshot };
        Object.keys(state.sliders).forEach(key => {
            const el = document.getElementById(key);
            if (el) el.value = state.sliders[key];
        });
    } else {
        document.getElementById('mainTitle').value = '';
        document.getElementById('subTitle').value  = '';
        document.getElementById('highlightWords').value = '';
        products.A = { noBg: null, snapshot: null };
        products.B = { noBg: null, snapshot: null };
        ['scaleSlider','scaleNum','briSlider','briNum'].forEach(cls => {
            ['A','B'].forEach(side => {
                const el = document.getElementById(`${cls}${side}`);
                if (el) el.value = cls.includes('bri') ? '100' : '100';
            });
        });
        ['offsetSlider','offsetNum','offsetxSlider','offsetxNum'].forEach(cls => {
            ['A','B'].forEach(side => {
                const el = document.getElementById(`${cls}${side}`);
                if (el) el.value = '0';
            });
        });
    }

    // 刷新左侧预览
    ['A','B'].forEach(side => {
        const canvas = document.getElementById(`previewCanvas${side}`);
        const item   = document.getElementById(`uploadItem${side}`);
        const noBg = products[side].noBg;
        canvas.width = PREVIEW_W; canvas.height = PREVIEW_H;
        if (noBg) {
            item.classList.add('has-image');
            const scale = parseFloat(document.getElementById(`scaleNum${side}`).value) / 100 || 1;
            const off   = parseInt(document.getElementById(`offsetNum${side}`).value) || 0;
            const offx  = parseInt(document.getElementById(`offsetxNum${side}`).value) || 0;
            const bri   = parseInt(document.getElementById(`briNum${side}`).value) || 100;
            drawToPreview(canvas, noBg, scale, off, offx, bri);
            products[side].snapshot = snapshotCanvas(canvas);
        } else {
            item.classList.remove('has-image');
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        }
    });
}

//  工具函数
// ═══════════════════════════════════════════════════
function loadImg(src) {
    return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = src;
    });
}

function getTrimBounds(canvas) {
    const ctx = canvas.getContext('2d');
    const { width: w, height: h } = canvas;
    const d = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = 0, maxY = 0;
    for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++)
            if (d[(y * w + x) * 4 + 3] > 10) {
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
    if (maxX < minX) return null;
    return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

function calcAutoScale(noBgCanvas) {
    const b = getTrimBounds(noBgCanvas);
    if (!b) return 1;
    const sw = PREVIEW_W / b.w;
    return b.h * sw <= PREVIEW_H ? sw : PREVIEW_H / b.h;
}

function getPreviewW(side) { return PREVIEW_W; }
function getPreviewH(side) { return PREVIEW_H; }

// 将 canvas 内容旋转指定角度（度），返回新 canvas
function rotateCanvas(src, degrees) {
    const rad = degrees * Math.PI / 180;
    const b = getTrimBounds(src);
    if (!b) return src;

    // 裁剪出有效内容区
    const tmpC = document.createElement('canvas');
    tmpC.width = b.w; tmpC.height = b.h;
    tmpC.getContext('2d').drawImage(src, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);

    const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
    const newW = Math.ceil(b.w * cos + b.h * sin);
    const newH = Math.ceil(b.w * sin + b.h * cos);

    const out = document.createElement('canvas');
    out.width = newW; out.height = newH;
    const ctx = out.getContext('2d');
    ctx.translate(newW / 2, newH / 2);
    ctx.rotate(rad);
    ctx.drawImage(tmpC, -b.w / 2, -b.h / 2);
    return out;
}

function drawToPreview(canvas, noBg, scale, offsetY, offsetX, brightness) {
    const pw = canvas.width, ph = canvas.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, pw, ph);
    const b = getTrimBounds(noBg);
    if (!b) return;
    const dw = Math.round(b.w * scale), dh = Math.round(b.h * scale);
    ctx.drawImage(noBg, b.x, b.y, b.w, b.h, (pw - dw) / 2 + offsetX, ph - dh + offsetY, dw, dh);

    // 亮度调整
    if (brightness && brightness !== 100) {
        const imageData = ctx.getImageData(0, 0, pw, ph);
        const d = imageData.data;
        const factor = brightness / 100;
        for (let i = 0; i < d.length; i += 4) {
            if (d[i + 3] === 0) continue; // 跳过透明像素
            d[i]     = Math.min(255, Math.max(0, d[i] * factor));
            d[i + 1] = Math.min(255, Math.max(0, d[i + 1] * factor));
            d[i + 2] = Math.min(255, Math.max(0, d[i + 2] * factor));
        }
        ctx.putImageData(imageData, 0, 0);
    }
}

function snapshotCanvas(canvas) {
    return { dataURL: canvas.toDataURL('image/png'), w: canvas.width, h: canvas.height };
}

function bindSlider(slider, num, onChange) {
    slider.addEventListener('input', () => { num.value = slider.value; onChange(); });
    num.addEventListener('input', () => { slider.value = num.value; onChange(); });
}

let statusTimer = null;
function showStatus(msg, duration = 3000) {
    const el = document.getElementById('statusBar');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(statusTimer);
    if (duration > 0) statusTimer = setTimeout(() => el.classList.remove('show'), duration);
}

function initCategories() {
    document.querySelectorAll('input[name="category"]').forEach(radio => {
        radio.addEventListener('change', () => {
            // 首次选择品类前，用户可能已经填写文案、上传图片或调整素材；
            // 此时不执行“恢复空状态”，避免选择必填品类时清空当前编辑内容。
            const isFirstCategorySelection = !currentCat;

            // 保存当前品类状态
            if (currentCat) saveCategoryState(currentCat);
            // 切换
            currentCat = radio.value;
            // 首次选择保留当前内容；后续切换仍恢复各品类已保存的独立状态。
            if (!isFirstCategorySelection) restoreCategoryState(currentCat);
            updatePlaceholders();
            invalidateBannerDownload();
            updateBannerActionState();
            schedulePreview();
        });
    });
}

function hasSelectedBannerCategory() {
    return Boolean(document.querySelector('input[name="category"]:checked'));
}

function invalidateBannerDownload() {
    const dlBtn = document.getElementById('downloadBtn');
    dlBtn.disabled = true;
    delete dlBtn._canvas;
}

function updateBannerActionState() {
    document.getElementById('generateBtn').disabled = !hasSelectedBannerCategory();
    if (!hasSelectedBannerCategory()) invalidateBannerDownload();
}

function updatePlaceholders() {
    const mainTitle = document.getElementById('mainTitle');
    const subTitle  = document.getElementById('subTitle');
    const highlight = document.getElementById('highlightWords');
    if (currentCat === 'shoes') {
        mainTitle.placeholder = '520潮鞋心动季';
        subTitle.placeholder  = '鞋类宠粉 低至1折';
        highlight.placeholder = '1折';
    } else {
        mainTitle.placeholder = '520奢包特惠';
        subTitle.placeholder  = '最高减450 享12期分期';
        highlight.placeholder = '450 低至一折';
    }
}

// ═══════════════════════════════════════════════════
//  AI 抠图
// ═══════════════════════════════════════════════════
const BG_REMOVAL_TIMEOUT_MS = 90 * 1000;
let backgroundModelReady = false;

async function processFile(file) {
    const isPng = file.type === 'image/png' || file.name.toLowerCase().endsWith('.png');
    const hasAlpha = isPng && await checkTransparency(file);
    if (hasAlpha) return loadPngDirect(file);

    const controller = new AbortController();
    let timeoutId;
    const removalTask = removeBackground(file, {
        publicPath: BG_ASSET_PUBLIC_PATH,
        model: 'medium',
        output: { format: 'image/png', quality: 1 },
        fetchArgs: { signal: controller.signal },
    });
    const timeoutTask = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
            controller.abort();
            reject(new Error('模型加载超时，请检查网络后重试'));
        }, BG_REMOVAL_TIMEOUT_MS);
    });

    let blob;
    try {
        blob = await Promise.race([removalTask, timeoutTask]);
        backgroundModelReady = true;
    } finally {
        clearTimeout(timeoutId);
    }
    return blobToCanvas(blob);
}

function checkTransparency(file) {
    return new Promise(res => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img, 0, 0);
            const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
            for (let i = 3; i < d.length; i += 32) if (d[i] < 250) { res(true); return; }
            res(false);
        };
        img.onerror = () => res(false);
        img.src = url;
    });
}

function loadPngDirect(file) {
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            // 去豆包水印
            ctx.clearRect(Math.floor(c.width * 0.80), Math.floor(c.height * 0.92), c.width, c.height);
            res(c);
        };
        img.onerror = rej;
        img.src = url;
    });
}

function blobToCanvas(blob) {
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img, 0, 0);
            res(c);
        };
        img.onerror = rej;
        img.src = url;
    });
}

// ═══════════════════════════════════════════════════
//  商品上传绑定
// ═══════════════════════════════════════════════════
function bindProductUpload(side) {
    const fileEl      = document.getElementById(`file${side}`);
    const uploadItem  = document.getElementById(`uploadItem${side}`);
    const canvas      = document.getElementById(`previewCanvas${side}`);
    const advToggle   = document.getElementById(`advToggle${side}`);
    const advPanel    = document.getElementById(`advPanel${side}`);
    const scaleSlider = document.getElementById(`scaleSlider${side}`);
    const scaleNum    = document.getElementById(`scaleNum${side}`);
    const offSlider   = document.getElementById(`offsetSlider${side}`);
    const offNum      = document.getElementById(`offsetNum${side}`);
    const offxSlider  = document.getElementById(`offsetxSlider${side}`);
    const offxNum     = document.getElementById(`offsetxNum${side}`);
    const briSlider   = document.getElementById(`briSlider${side}`);
    const briNum      = document.getElementById(`briNum${side}`);
    let uploadTaskId = 0;

    // 精细调整折叠（阻止冒泡，防止触发 file input）
    advToggle.addEventListener('click', e => {
        e.stopPropagation();
        const open = advPanel.classList.toggle('show');
        advToggle.classList.toggle('open', open);
    });
    advPanel.addEventListener('click', e => e.stopPropagation());

    // 滑块联动
    const refresh = () => {
        const noBg = products[side].noBg;
        if (!noBg) return;
        drawToPreview(canvas, noBg, parseFloat(scaleNum.value) / 100, parseInt(offNum.value) || 0, parseInt(offxNum.value) || 0, parseInt(briNum.value) || 100);
        products[side].snapshot = snapshotCanvas(canvas);
        schedulePreview();
    };
    bindSlider(scaleSlider, scaleNum, refresh);
    bindSlider(offSlider, offNum, refresh);
    bindSlider(offxSlider, offxNum, refresh);
    bindSlider(briSlider, briNum, refresh);

    // 文件上传
    fileEl.addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        const taskId = ++uploadTaskId;
        const isFirstModelLoad = !backgroundModelReady;

        // 更新画布尺寸
        const pw = getPreviewW(side), ph = getPreviewH(side);
        canvas.width = pw; canvas.height = ph;

        const ctx = canvas.getContext('2d');
        // 首次上传时也先切换到预览态，确保显示灰底 loading，而非默认上传占位。
        uploadItem.classList.add('has-image', 'is-processing');
        ctx.fillStyle = '#f4f4f4';
        ctx.fillRect(0, 0, pw, ph);
        ctx.fillStyle = '#aaa';
        ctx.font = '14px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(
            isFirstModelLoad ? '处理中，首次加载模型约10秒' : '处理中，加载模型约10秒',
            pw / 2,
            ph / 2
        );
        ctx.textAlign = 'left';

        try {
            let noBg = await processFile(file);
            if (taskId !== uploadTaskId) return;
            // 鞋类：按商品分别旋转
            if (currentCat === 'shoes') {
                noBg = rotateCanvas(noBg, -30);
            }
            products[side].noBg = noBg;
            const autoScale = Math.round(calcAutoScale(noBg) * 100);
            scaleSlider.value = scaleNum.value = autoScale;
            offSlider.value = offNum.value = 0;
            offxSlider.value = offxNum.value = 0;
            briSlider.value = briNum.value = 100;
            drawToPreview(canvas, noBg, autoScale / 100, 0, 0, 100);
            products[side].snapshot = snapshotCanvas(canvas);
            schedulePreview();
        } catch (err) {
            if (taskId !== uploadTaskId) return;
            ctx.fillStyle = '#f4f4f4';
            ctx.fillRect(0, 0, pw, ph);
            ctx.fillStyle = '#f87171';
            ctx.textAlign = 'center';
            ctx.fillText(
                err && err.message === '模型加载超时，请检查网络后重试'
                    ? '模型加载超时，请检查网络后重试'
                    : '处理失败，请重试',
                pw / 2,
                ph / 2
            );
            ctx.textAlign = 'left';
            console.error(err);
        } finally {
            if (taskId === uploadTaskId) uploadItem.classList.remove('is-processing');
        }
    });

    // 点击预览大图（阻止冒泡，不触发 file input）
    canvas.addEventListener('click', e => {
        if (!products[side].noBg) return;
        e.stopPropagation();
        document.getElementById('lightboxImg').src = canvas.toDataURL('image/png');
        document.getElementById('lightboxOverlay').classList.add('show');
    });
}

// ═══════════════════════════════════════════════════
//  文字渲染
// ═══════════════════════════════════════════════════
function drawSubtitle(ctx, text, x, y, fontSize, color, highlightWords, hlColor) {
    if (!text) return;
    ctx.textBaseline = 'top';
    if (!highlightWords || !highlightWords.trim()) {
        ctx.font = `400 ${fontSize}px "PingFang SC"`;
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        return;
    }
    const words = highlightWords.split(/[\s,，]+/).map(w => w.trim()).filter(Boolean);
    const regex = new RegExp(`(${words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
    const parts = []; let last = 0, m;
    while ((m = regex.exec(text)) !== null) {
        if (m.index > last) parts.push({ t: text.slice(last, m.index), hi: false });
        parts.push({ t: m[0], hi: true });
        last = regex.lastIndex;
    }
    if (last < text.length) parts.push({ t: text.slice(last), hi: false });
    let curX = x;
    parts.forEach(p => {
        ctx.font = `${p.hi ? 600 : 400} ${fontSize}px "PingFang SC"`;
        ctx.fillStyle = p.hi ? hlColor : color;
        ctx.fillText(p.t, curX, y);
        curX += ctx.measureText(p.t).width;
    });
}

// ═══════════════════════════════════════════════════
//  实时预览渲染（防抖 50ms）
// ═══════════════════════════════════════════════════
let _previewTimer = null;
function schedulePreview() {
    clearTimeout(_previewTimer);
    _previewTimer = setTimeout(renderPreview, 50);
}

async function renderPreview() {
    if (!bgImg) return;

    const canvas = document.createElement('canvas');
    canvas.width = CANVAS_W; canvas.height = CANVAS_H;
    const ctx = canvas.getContext('2d');

    const drawScaled = (img, x, y, tw) => {
        if (!img) return;
        ctx.drawImage(img, x, y, tw, img.height * (tw / img.width));
    };

    // 1. 底图
    ctx.drawImage(bgImg, 0, 0, CANVAS_W, CANVAS_H);

    // 2. 左右装饰（本次大促隐藏，仅保留品宣条 deco4）
    // drawScaled(decoLeft,  DECO_LEFT_POS.x,  DECO_LEFT_POS.y,  DECO_LEFT_POS.width);
    // drawScaled(decoRight, DECO_RIGHT_POS.x, DECO_RIGHT_POS.y, DECO_RIGHT_POS.width);

    // 3. 商品图（有哪张画哪张，不强制要求两张都有）
    const drawSnap = (snap, x, y) => new Promise(res => {
        if (!snap) { res(); return; }
        const img = new Image();
        img.onload = () => { ctx.drawImage(img, x, y, snap.w, snap.h); res(); };
        img.src = snap.dataURL;
    });
    const bPos = currentCat === 'shoes' ? PROD_B_POS_SHOES : PROD_B_POS;
    await drawSnap(products.A.snapshot, PROD_A_POS.x, PROD_A_POS.y);
    await drawSnap(products.B.snapshot, bPos.x, bPos.y);

    // 4. 品宣条置顶
    drawScaled(deco4Img, DECO4_POS.x, DECO4_POS.y, DECO4_POS.width);

    // 5. 文字
    const mainTitle = document.getElementById('mainTitle').value;
    const subTitle  = document.getElementById('subTitle').value;
    const highlight = document.getElementById('highlightWords').value;

    if (mainTitle) {
        ctx.font = `400 ${TEXT_STYLE.mainSize}px "POIZONSans", "PingFang SC"`;
        ctx.fillStyle = TEXT_STYLE.mainColor;
        ctx.textBaseline = 'top';
        let curX = TITLE_POS.x;
        for (const char of mainTitle) {
            ctx.fillText(char, curX, TITLE_POS.y);
            curX += ctx.measureText(char).width + 3;
        }
    }
    drawSubtitle(ctx, subTitle, SUBTITLE_POS.x, SUBTITLE_POS.y, TEXT_STYLE.subSize, TEXT_STYLE.subColor, highlight, TEXT_STYLE.highlightColor);

    // 更新右侧画布（不重置缩放，只刷新内容）
    displayResult(canvas, false);
}

// ═══════════════════════════════════════════════════
//  生成头图（触发下载用的完整渲染，复用 renderPreview 结果）
// ═══════════════════════════════════════════════════
async function generate() {
    if (!hasSelectedBannerCategory()) {
        updateBannerActionState();
        showStatus('请先选择其他品类或鞋类'); return;
    }
    if (!products.A.snapshot && !products.B.snapshot) {
        showStatus('请先上传并处理至少一张商品图'); return;
    }
    showStatus('生成中…', 0);
    await renderPreview();
    showStatus('✓ 生成完成');

    // 激活下载按钮，取右侧当前画布内容
    const inner = document.getElementById('canvasInner');
    const c = inner.querySelector('canvas');
    if (c) {
        const dlBtn = document.getElementById('downloadBtn');
        if (hasSelectedBannerCategory()) {
            dlBtn.disabled = false;
            dlBtn._canvas = c;
        }
    }
}

// ═══════════════════════════════════════════════════
//  右侧画布展示
// ═══════════════════════════════════════════════════
function displayResult(srcCanvas, resetView = true) {
    const inner = document.getElementById('canvasInner');
    document.getElementById('placeholder').style.display = 'none';

    // 复用已有 canvas 而不是每次新建，避免 dblclick 重复绑定
    let c = inner.querySelector('canvas');
    if (!c) {
        c = document.createElement('canvas');
        c.width = CANVAS_W; c.height = CANVAS_H;
        inner.appendChild(c);
        c.addEventListener('dblclick', () => {
            document.getElementById('lightboxImg').src = c.toDataURL('image/png');
            document.getElementById('lightboxOverlay').classList.add('show');
        });
    }
    c.getContext('2d').drawImage(srcCanvas, 0, 0);

    if (resetView) fitToView();
}

// ═══════════════════════════════════════════════════
//  画布缩放 & 拖拽
// ═══════════════════════════════════════════════════
let scale = 1, translateX = 0, translateY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0, dragOriginX = 0, dragOriginY = 0;
let isLocked = false;

function applyTransform() {
    const inner = document.getElementById('canvasInner');
    inner.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

function fitToView() {
    const panel = document.getElementById('rightPanel');
    const pw = panel.clientWidth - 80, ph = panel.clientHeight - 80;
    scale = Math.min(pw / CANVAS_W, ph / CANVAS_H, 1);
    translateX = 0; translateY = 0;
    applyTransform();
}

function setupCanvasControls() {
    const wrapper = document.getElementById('canvasWrapper');

    // 滚轮缩放
    wrapper.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.08 : 0.08;
        scale = Math.min(Math.max(scale + delta, 0.15), 4);
        applyTransform();
    }, { passive: false });

    // 拖拽
    wrapper.addEventListener('mousedown', e => {
        if (isLocked) return;
        isDragging = true;
        dragStartX = e.clientX; dragStartY = e.clientY;
        dragOriginX = translateX; dragOriginY = translateY;
        wrapper.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        translateX = dragOriginX + (e.clientX - dragStartX);
        translateY = dragOriginY + (e.clientY - dragStartY);
        applyTransform();
    });
    window.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        wrapper.style.cursor = isLocked ? 'default' : 'grab';
    });

    // 工具栏按钮
    document.getElementById('zoomInBtn').addEventListener('click', () => {
        scale = Math.min(scale + 0.15, 4); applyTransform();
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
        scale = Math.max(scale - 0.15, 0.15); applyTransform();
    });
    document.getElementById('zoomResetBtn').addEventListener('click', fitToView);
    document.getElementById('lockBtn').addEventListener('click', e => {
        isLocked = !isLocked;
        e.currentTarget.classList.toggle('active', isLocked);
        wrapper.style.cursor = isLocked ? 'default' : 'grab';
    });
}

// ═══════════════════════════════════════════════════
//  Lightbox
// ═══════════════════════════════════════════════════
function setupLightbox() {
    document.getElementById('lightboxOverlay').addEventListener('click', function() {
        this.classList.remove('show');
    });
}

// ═══════════════════════════════════════════════════
//  优惠券模块
// ═══════════════════════════════════════════════════
const COUPON_W = 1053, COUPON_H = 153;
const COUPON_AMOUNT_POS = { x: 264, y: 40 };
const COUPON_AMOUNT_FONT_SIZE = 78;
const COUPON_AMOUNT_LETTER_SPACING = -(COUPON_AMOUNT_FONT_SIZE * 0.02);
const COUPON_TEXT_X = 429;
const COUPON_TEXT_COLOR = '#200013';
const COUPON_DEFAULT_TEXT = '官方限时优惠券';
let couponBg = null;

async function loadCouponAssets() {
    couponBg = await loadImg(ASSET_COUPON);
    try {
        await Promise.all([
            document.fonts.load('600 78px "D-DIN-PRO"'),
            document.fonts.load('500 39px "Alibaba PuHuiTi 3.0"'),
        ]);
        await document.fonts.ready;
    } catch (e) { /* 字体加载失败则用回退字体 */ }
}

function renderCoupon() {
    const canvas = document.getElementById('couponCanvas');
    if (!canvas) return;
    canvas.width = COUPON_W; canvas.height = COUPON_H;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, COUPON_W, COUPON_H);
    if (couponBg) ctx.drawImage(couponBg, 0, 0, COUPON_W, COUPON_H);

    const amount = document.getElementById('couponAmount').value;
    const text   = document.getElementById('couponText').value || COUPON_DEFAULT_TEXT;

    ctx.textBaseline = 'top';
    if (amount) {
        ctx.font = `600 ${COUPON_AMOUNT_FONT_SIZE}px "D-DIN-PRO", "D-DIN", "DIN Alternate", "Bahnschrift", system-ui, sans-serif`;
        ctx.fillStyle = COUPON_TEXT_COLOR;
        // -2% 字距，按金额字号换算为 -1.56px。
        ctx.letterSpacing = `${COUPON_AMOUNT_LETTER_SPACING}px`;
        ctx.fillText(amount, COUPON_AMOUNT_POS.x, COUPON_AMOUNT_POS.y);
        ctx.letterSpacing = '0px';
    }
    if (text) {
        ctx.font = '500 39px "Alibaba PuHuiTi 3.0", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
        ctx.fillStyle = COUPON_TEXT_COLOR;
        // 保持 X 坐标为 429，并按实际字形高度在优惠券中垂直居中。
        ctx.textBaseline = 'alphabetic';
        const metrics = ctx.measureText(text);
        const ascent = metrics.actualBoundingBoxAscent || 31;
        const descent = metrics.actualBoundingBoxDescent || 8;
        const textY = (COUPON_H - ascent - descent) / 2 + ascent;
        ctx.fillText(text, COUPON_TEXT_X, textY);
    }
}

function generateCoupon() {
    renderCoupon();
    showStatus('✓ 优惠券已生成');
}

function downloadCoupon() {
    const canvas = document.getElementById('couponCanvas');
    if (!canvas) return;
    try {
        canvas.toBlob(blob => {
            if (!blob) { showStatus('导出失败，请重试'); return; }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `coupon_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            showStatus('✓ 已下载优惠券');
        }, 'image/png');
    } catch (err) {
        console.error('优惠券下载失败', err);
        showStatus('下载失败：' + (err && err.message ? err.message : '未知错误'));
    }
}

// ═══════════════════════════════════════════════════
//  头图 JPG 导出（严格控制在 300 KB 以内）
// ═══════════════════════════════════════════════════
const BANNER_MAX_FILE_SIZE = 300 * 1000;
const BANNER_JPEG_QUALITIES = [0.92, 0.84, 0.76, 0.68, 0.60, 0.52, 0.44, 0.36, 0.28, 0.20];
const BANNER_EXPORT_SCALES = [1, 0.92, 0.84, 0.76, 0.68, 0.60, 0.52, 0.44];

function canvasToBlob(canvas, type, quality) {
    return new Promise(resolve => canvas.toBlob(resolve, type, quality));
}

async function exportCompressedBanner(canvas) {
    let smallestBlob = null;

    for (const scaleFactor of BANNER_EXPORT_SCALES) {
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = Math.max(1, Math.round(canvas.width * scaleFactor));
        exportCanvas.height = Math.max(1, Math.round(canvas.height * scaleFactor));

        const exportCtx = exportCanvas.getContext('2d');
        // JPG 不支持透明通道，先铺白底以避免透明区域变黑。
        exportCtx.fillStyle = '#FFFFFF';
        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
        exportCtx.imageSmoothingEnabled = true;
        exportCtx.imageSmoothingQuality = 'high';
        exportCtx.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);

        for (const quality of BANNER_JPEG_QUALITIES) {
            const blob = await canvasToBlob(exportCanvas, 'image/jpeg', quality);
            if (!blob) continue;
            if (!smallestBlob || blob.size < smallestBlob.size) smallestBlob = blob;
            if (blob.size <= BANNER_MAX_FILE_SIZE) return blob;
        }
    }

    throw new Error(`无法将头图压缩至 ${Math.round(BANNER_MAX_FILE_SIZE / 1000)}KB 以内`);
}

// ═══════════════════════════════════════════════════
//  Tab 切换
// ═══════════════════════════════════════════════════
function switchTab(tab) {
    document.getElementById('tabBannerBtn').classList.toggle('active', tab === 'banner');
    document.getElementById('tabCouponBtn').classList.toggle('active', tab === 'coupon');
    document.getElementById('bannerPanel').style.display  = tab === 'banner' ? '' : 'none';
    document.getElementById('couponPanel').style.display = tab === 'coupon' ? '' : 'none';
    document.getElementById('canvasWrapper').style.display = tab === 'banner' ? '' : 'none';
    const tb = document.querySelector('.canvas-toolbar');
    if (tb) tb.style.display = tab === 'banner' ? '' : 'none';
    const ca = document.getElementById('couponArea');
    if (ca) ca.style.display = tab === 'coupon' ? 'flex' : 'none';
    if (tab === 'coupon') renderCoupon();
    else schedulePreview();
}

function limitNonWhitespaceCharacters(value, maxCharacters) {
    let characterCount = 0;
    return Array.from(value).filter(char => {
        if (/\s/.test(char)) return true;
        if (characterCount >= maxCharacters) return false;
        characterCount += 1;
        return true;
    }).join('');
}

function bindImeSafeInput(element, onCommit) {
    let isComposing = false;

    element.addEventListener('compositionstart', () => {
        isComposing = true;
    });
    element.addEventListener('compositionend', () => {
        isComposing = false;
        onCommit();
    });
    element.addEventListener('input', event => {
        // 中文拼音属于输入法的临时组词状态：不预览、不执行字数截断。
        if (isComposing || event.isComposing) return;
        onCommit();
    });
}

// ═══════════════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════════════
(async () => {
    try {
        await loadAssets();
    } catch (e) {
        console.warn('部分素材加载失败', e);
    }
    initCategories();
    updateBannerActionState();
    bindProductUpload('A');
    bindProductUpload('B');
    setupCanvasControls();
    setupLightbox();

    // 优惠券素材与交互
    try { await loadCouponAssets(); } catch (e) { console.warn('优惠券素材加载失败', e); }
    document.getElementById('tabBannerBtn').addEventListener('click', () => switchTab('banner'));
    document.getElementById('tabCouponBtn').addEventListener('click', () => switchTab('coupon'));
    document.getElementById('couponGenBtn').addEventListener('click', generateCoupon);
    document.getElementById('couponDlBtn').addEventListener('click', downloadCoupon);
    ['couponAmount', 'couponText'].forEach(id =>
        document.getElementById(id).addEventListener('input', renderCoupon));
    renderCoupon();

    // 主标题最多 9 个非空白字符；中文输入法完成选词后再限制并刷新预览。
    const mainTitleInput = document.getElementById('mainTitle');
    bindImeSafeInput(mainTitleInput, () => {
        mainTitleInput.value = limitNonWhitespaceCharacters(mainTitleInput.value, 9);
        schedulePreview();
    });
    ['subTitle', 'highlightWords'].forEach(id => {
        bindImeSafeInput(document.getElementById(id), schedulePreview);
    });

    // 素材加载完后立即渲染底图
    renderPreview();

    document.getElementById('generateBtn').addEventListener('click', generate);

    // 互换商品
    document.getElementById('swapBtn').addEventListener('click', () => {
        // 交换 noBg 和 snapshot
        [products.A, products.B] = [products.B, products.A];

        // 交换精细调整滑块值
        ['scaleSlider','scaleNum','offsetSlider','offsetNum','offsetxSlider','offsetxNum','briSlider','briNum'].forEach(cls => {
            const aEl = document.getElementById(`${cls}A`);
            const bEl = document.getElementById(`${cls}B`);
            if (aEl && bEl) {
                const tmp = aEl.value;
                aEl.value = bEl.value;
                bEl.value = tmp;
            }
        });

        // 根据交换后是否有图，设置 has-image 样式
        ['A','B'].forEach(side => {
            const item = document.getElementById(`uploadItem${side}`);
            if (products[side].noBg) {
                item.classList.add('has-image');
            } else {
                item.classList.remove('has-image');
            }
        });

        // 重新绘制左侧预览
        ['A','B'].forEach(side => {
            const canvas = document.getElementById(`previewCanvas${side}`);
            const noBg = products[side].noBg;
            if (noBg) {
                const scale = parseFloat(document.getElementById(`scaleNum${side}`).value) / 100 || 1;
                const off = parseInt(document.getElementById(`offsetNum${side}`).value) || 0;
                const offx = parseInt(document.getElementById(`offsetxNum${side}`).value) || 0;
                const bri = parseInt(document.getElementById(`briNum${side}`).value) || 100;
                canvas.width = PREVIEW_W; canvas.height = PREVIEW_H;
                drawToPreview(canvas, noBg, scale, off, offx, bri);
                products[side].snapshot = snapshotCanvas(canvas);
            } else {
                canvas.width = PREVIEW_W; canvas.height = PREVIEW_H;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        schedulePreview();
    });

    document.getElementById('downloadBtn').addEventListener('click', async () => {
        if (!hasSelectedBannerCategory()) {
            updateBannerActionState();
            showStatus('请先选择其他品类或鞋类');
            return;
        }
        const dlBtn = document.getElementById('downloadBtn');
        const canvas = dlBtn._canvas;
        if (!canvas) { showStatus('请先生成头图'); return; }
        try {
            showStatus('正在压缩头图…', 0);
            const blob = await exportCompressedBanner(canvas);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `banner_${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            showStatus(`✓ 已下载 JPG 头图（${Math.ceil(blob.size / 1000)}KB）`);
        } catch (err) {
            console.error('下载失败', err);
            showStatus('下载失败：' + (err && err.message ? err.message : '未知错误'));
        }
    });
})();
